services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: alunostech-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:?Defina SQL_SERVER_PASSWORD antes de iniciar o SQL Server}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1"']
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  sqlserver-data:
